# Database migrations, as a Job that runs to completion.
#
# WHY THIS IS NOT IN THE APP'S STARTUP
#
# The Deployment runs two replicas. If `alembic upgrade head` ran when the app
# boots, both pods would start it at the same moment against the same database.
# Alembic takes a lock so they would not both write, but the loser waits, and on
# a slow migration it fails its readiness probe and gets killed mid-migration.
#
# A Job is the correct shape: exactly one pod, run once, must exit 0. The deploy
# waits for it before rolling the app.
#
# The image tag is substituted at deploy time; see .github/workflows.
apiVersion: batch/v1
kind: Job
metadata:
  name: ecomapi-migrate
spec:
  # Do not retry forever against a genuinely broken migration.
  backoffLimit: 2
  # Clean the Job object up 5 minutes after it finishes, so repeated deploys do
  # not leave a pile of completed Jobs behind.
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: __IMAGE__
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: ecomapi-config
            - secretRef:
                name: ecomapi-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
